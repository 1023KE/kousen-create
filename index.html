<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>高専祭 組立スケジュール</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 30px;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    margin-top: 0;
}


/* =========================
   メニュー
========================= */

.menu {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.menu button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #222;
    color: white;
}

.menu button:hover {
    opacity: 0.8;
}


/* =========================
   日付
========================= */

.days {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin: 20px 0;
}

.day {
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-size: 16px;
}

.day:hover {
    background: #eee;
}

.day.selected {
    background: #222;
    color: white;
    border-color: #222;
}


/* =========================
   班
========================= */

.team {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.team h2 {
    margin-top: 0;
}

.member {
    display: inline-block;
    padding: 7px 10px;
    margin: 4px;
    background: #f1f1f1;
    border-radius: 8px;
}

.member.leader {
    background: #fff0a8;
    border: 1px solid #e0c000;
}

.count {
    color: #777;
    font-size: 14px;
}


/* =========================
   管理者画面
========================= */

#adminPage {
    display: none;
}

.adminBox {
    background: #f7f7f7;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.adminTeam {
    background: white;
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.adminTeam h3 {
    margin-top: 0;
}

.adminTeam select {
    width: 100%;
    max-width: 450px;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

input,
select {
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

input[type="text"] {
    width: 100%;
    max-width: 450px;
}

.addButton {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

.addButton:hover {
    opacity: 0.8;
}

.backButton {
    margin-bottom: 20px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #ddd;
}


/* =========================
   参加可能日
========================= */

.dayChecks {
    margin-top: 10px;
}

.dayChecks label {
    margin-right: 15px;
    display: inline-block;
    margin-bottom: 8px;
}


/* =========================
   ログ
========================= */

.log {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
}

.logTime {
    color: #777;
    font-size: 13px;
}

.logMessage {
    margin-top: 4px;
}

.notice {
    background: #fff3cd;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}


/* =========================
   スマホ対応
========================= */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
    }

    .days {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
    }

    .day {
        padding: 10px 3px;
        font-size: 14px;
    }

}

</style>
</head>


<body>


<div class="container">


<!-- ==================================================
     通常画面
================================================== -->

    <div class="menu">

<script>

/* ==================================================
   リーダー
================================================== */

let leaders = {};


/* ==================================================
   ログ
================================================== */

/* ==================================================
   共有データ（Google Apps Script）
================================================== */

const DATA_API_URL = "https://script.google.com/a/macros/st.omu.ac.jp/s/AKfycbzlMZDw6R5nHIeG3-5GUCJh56Cp4hkimDnxTG_m8DLjUW6obVLfn264aeAWYiHfN1qkoQ/exec";

let logs = [];


/* ==================================================
   共有データ読み込み
================================================== */

async function loadSharedData() {

    try {

        const response = await fetch(DATA_API_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (data && data.teams) {

            teams = data.teams;
            leaders = data.leaders || {};
            logs = data.logs || [];

        } else {

            // 共有データがまだない場合は、HTML内の初期データを使用して保存
            await saveData();

        }

    } catch (error) {

        console.error("共有データの読み込みに失敗しました:", error);

        alert(
            "共有データを読み込めませんでした。\n" +
            "Google Apps Scriptの設定を確認してください。"
        );

    }

}


/* ==================================================
   共有データ保存
================================================== */

async function saveData() {

    try {

        const response = await fetch(DATA_API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                teams: teams,
                leaders: leaders,
                logs: logs
            })
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const result = await response.json();

        if (!result.success) {
            throw new Error("保存に失敗しました");
        }

    } catch (error) {

        console.error("共有データの保存に失敗しました:", error);

        alert(
            "変更を共有データに保存できませんでした。\n" +
            "Google Apps Scriptの設定を確認してください。"
        );

    }

}


/* ==================================================
   ログ追加
================================================== */

function addLog(message) {

    const now = new Date();


    const time =
        now.getFullYear() + "/" +

        String(
            now.getMonth() + 1
        ).padStart(2, "0") + "/" +

        String(
            now.getDate()
        ).padStart(2, "0") + " " +

        String(
            now.getHours()
        ).padStart(2, "0") + ":" +

        String(
            now.getMinutes()
        ).padStart(2, "0") + ":" +

        String(
            now.getSeconds()
        ).padStart(2, "0");


    logs.unshift({

        time: time,

        message: message

    });
    saveData();

}



/* ==================================================
   管理者画面を開く
================================================== */

function openAdmin() {

    const password =
        prompt(
            "管理者パスワードを入力してください"
        );


    if (password !== "1234567890") {

        alert(
            "パスワードが違います。"
        );

        return;

    }


    document.getElementById(
        "mainPage"
    ).style.display = "none";


    document.getElementById(
        "adminPage"
    ).style.display = "block";


    createAdminPage();

}



/* ==================================================
   管理者画面を閉じる
================================================== */

function closeAdmin() {

    document.getElementById(
        "adminPage"
    ).style.display = "none";


    document.getElementById(
        "mainPage"
    ).style.display = "block";


    showSchedule("19");

}



/* ==================================================
   管理者画面作成
================================================== */

function createAdminPage() {


    const leaderSettings =
        document.getElementById(
            "leaderSettings"
        );


    const newTeam =
        document.getElementById(
            "newTeam"
        );


    leaderSettings.innerHTML = "";

    newTeam.innerHTML = "";



    for (const teamName in teams) {


        /* =========================
           リーダー設定
        ========================= */

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "adminTeam";


        const title =
            document.createElement(
                "h3"
            );

        title.textContent =
            teamName;


        box.appendChild(title);



        const select =
            document.createElement(
                "select"
            );


        select.onchange =
            function() {


                const oldLeader =
                    leaders[teamName] ||
                    "なし";


                const newLeader =
                    this.value ||
                    "なし";


                leaders[teamName] =
                    this.value;


                addLog(
                    "リーダー変更："
                    + teamName
                    + " / "
                    + oldLeader
                    + " → "
                    + newLeader
                );


                saveData();


                showLogs();


                showSchedule("19");

            };



        /* リーダーなし */

        const none =
            document.createElement(
                "option"
            );

        none.value = "";

        none.textContent =
            "リーダーなし";

        select.appendChild(none);



        /* メンバー */

        teams[teamName].forEach(
            member => {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    member[0];


                option.textContent =
                    member[0]
                    + " "
                    + member[1];


                if (
                    leaders[teamName]
                    === member[0]
                ) {

                    option.selected =
                        true;

                }


                select.appendChild(
                    option
                );

            }
        );


        box.appendChild(select);

        leaderSettings.appendChild(box);



        /* =========================
           班選択
        ========================= */

        const teamOption =
            document.createElement(
                "option"
            );


        teamOption.value =
            teamName;


        teamOption.textContent =
            teamName;


        newTeam.appendChild(
            teamOption
        );

    }


    showLogs();
    showMemberManagement();

}



/* ==================================================
   メンバー管理
================================================== */

function showMemberManagement() {

    const container = document.getElementById("memberManagement");

    if (!container) return;

    container.innerHTML = "";

    for (const teamName in teams) {

        const heading = document.createElement("h3");
        heading.textContent = teamName;
        container.appendChild(heading);

        teams[teamName].forEach(member => {

            const box = document.createElement("div");
            box.className = "memberManage";

            const info = document.createElement("div");
            info.className = "memberInfo";
            info.textContent = member[0] + " " + member[1];

            const days = document.createElement("div");
            days.className = "memberDays";

            ["19","20","21","22","23"].forEach(day => {

                const label = document.createElement("label");
                label.style.marginRight = "12px";
                label.style.display = "inline-block";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = day;
                checkbox.checked = member[2].includes(day);

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(" " + day + "日"));
                days.appendChild(label);

            });

            const buttons = document.createElement("div");
            buttons.className = "memberManageButtons";

            const editButton = document.createElement("button");
            editButton.className = "editButton";
            editButton.textContent = "予定を変更";

            editButton.onclick = function() {

                const selectedDays = [];

                days.querySelectorAll("input:checked").forEach(check => {!
                    selectedDays.push(check.value);
                });

                const oldDays = member[2].slice();
                member[2] = selectedDays;

                addLog(
                    "参加可能日変更：" +
                    member[0] + " " + member[1] +
                    " / " + oldDays.join(", ") +
                    " → " + selectedDays.join(", ")
                );

                saveData();
                createAdminPage();
                showSchedule("19");

                alert(member[0] + " " + member[1] + " の予定を変更しました。");
            };

            const deleteButton = document.createElement("button");
            deleteButton.className = "deleteButton";
            deleteButton.textContent = "削除";

            deleteButton.onclick = function() {

                if (!confirm(member[0] + " " + member[1] + " を削除しますか？")) {
                    return;
                }

                const index = teams[teamName].indexOf(member);
                if (index === -1) return;

                teams[teamName].splice(index, 1);

                if (leaders[teamName] === member[0]) {
                    const oldLeader = leaders[teamName];
                    leaders[teamName] = "";

                    addLog(
                        "メンバー削除によりリーダー解除：" +
                        teamName + " / " + oldLeader
                    );
                }

                addLog(
                    "メンバー削除：" +
                    member[0] + " " + member[1] +
                    " / " + teamName
                );

                saveData();
                createAdminPage();
                showSchedule("19");

                alert(member[0] + " " + member[1] + " を削除しました。");
            };

            buttons.appendChild(editButton);
            buttons.appendChild(deleteButton);

            box.appendChild(info);
            box.appendChild(days);
            box.appendChild(buttons);

            container.appendChild(box);
        });
    }
}



/* ==================================================
   メンバー追加
================================================== */

function addMember() {


    const number =
        document.getElementById(
            "newNumber"
        ).value.trim();


    const name =
        document.getElementById(
            "newName"
        ).value.trim();


    const team =
        document.getElementById(
            "newTeam"
        ).value;



    /* 参加可能日 */

    const days = [];


    document.querySelectorAll(
        ".dayChecks input[type='checkbox']:checked"
    ).forEach(
        check => {

            days.push(
                check.value
            );

        }
    );



    /* 入力確認 */

    if (!number || !name) {

        alert(
            "番号と名前を入力してください。"
        );

        return;

    }



    if (days.length === 0) {

        alert(
            "参加可能日を1つ以上選択してください。"
        );

        return;

    }



    /* 番号重複確認 */

    for (
        const teamName in teams
    ) {


        const exists =
            teams[teamName].some(
                member =>
                    member[0] === number
            );


        if (exists) {

            alert(
                "その番号はすでに登録されています。"
            );

            return;

        }

    }



    /* メンバー追加 */

    teams[team].push([

        number,

        name,

        days

    ]);



    /* ログ */

    addLog(

        "メンバー追加："
        + number
        + " "
        + name
        + " / "
        + team
        + " / 参加可能日："
        + days.join(", ")

    );



    /* 保存 */

    saveData();



    /* 入力欄クリア */

    document.getElementById(
        "newNumber"
    ).value = "";


    document.getElementById(
        "newName"
    ).value = "";


    document.querySelectorAll(
        ".dayChecks input[type='checkbox']"
    ).forEach(
        check => {

            check.checked = false;

        }
    );



    alert(
        number
        + " "
        + name
        + " を追加しました。"
    );



    createAdminPage();

}



/* ==================================================
   日付選択
================================================== */

function showDay(
    day,
    button
) {


    document.getElementById(
        "selectedDate"
    ).textContent =
        "10月"
        + day
        + "日";



    document.querySelectorAll(
        ".day"
    ).forEach(
        btn => {

            btn.classList.remove(
                "selected"
            );

        }
    );



    if (button) {

        button.classList.add(
            "selected"
        );

    }



    showSchedule(day);

}



/* ==================================================
   スケジュール表示
================================================== */

function showSchedule(day) {


    const schedule =
        document.getElementById(
            "schedule"
        );


    schedule.innerHTML = "";



    for (
        const teamName in teams
    ) {


        const members =
            teams[teamName];



        /* 参加できる人 */

        const available =
            members.filter(
                member =>
                    !member[2].includes(day)
            );



        const team =
            document.createElement(
                "div"
            );


        team.className =
            "team";



        /* 班名 */

        const title =
            document.createElement(
                "h2"
            );


        title.textContent =
            teamName;


        team.appendChild(title);



        /* 人数 */

        const count =
            document.createElement(
                "div"
            );


        count.className =
            "count";


        count.textContent =
            available.length
            + "人参加";


        team.appendChild(count);



        /* メンバー */

        available.forEach(
            member => {


                const div =
                    document.createElement(
                        "span"
                    );


                div.className =
                    "member";



                /* リーダー */

                if (
                    leaders[teamName]
                    === member[0]
                ) {


                    div.classList.add(
                        "leader"
                    );


                    div.textContent =
                        "👑 "
                        + member[0]
                        + " "
                        + member[1];


                } else {


                    div.textContent =
                        member[0]
                        + " "
                        + member[1];

                }



                team.appendChild(div);

            }
        );



        /* 誰もいない */

        if (
            available.length === 0
        ) {


            const none =
                document.createElement(
                    "p"
                );


            none.textContent =
                "参加者なし";


            team.appendChild(none);

        }



        schedule.appendChild(team);

    }

}



/* ==================================================
   ログ表示
================================================== */

function showLogs() {


    const logList =
        document.getElementById(
            "logList"
        );


    if (!logList) {

        return;

    }


    logList.innerHTML = "";



    if (logs.length === 0) {


        logList.innerHTML =
            "<p>まだ操作ログはありません。</p>";


        return;

    }



    logs.forEach(
        log => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "log";


            div.innerHTML =

                '<div class="logTime">'
                + escapeHTML(log.time)
                + '</div>'

                +

                '<div class="logMessage">'
                + escapeHTML(log.message)
                + '</div>';


            logList.appendChild(div);

        }
    );

}



/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}



/* ==================================================
   ログ全削除
================================================== */

function clearLogs() {


    if (
        !confirm(
            "操作ログをすべて削除しますか？"
        )
    ) {

        return;

    }



    logs = [];


    saveData();
    showLogs();

}



/* ==================================================
   最初の表示
================================================== */

loadSharedData().then(() => {
    showSchedule("19");
});
